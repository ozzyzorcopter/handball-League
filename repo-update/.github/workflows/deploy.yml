name: Build and deploy site

# Builds the app (esbuild), runs the tests and publishes dist/ to GitHub Pages.
# Data commits made by the fetch workflows do not trigger this: they are pushed
# with GITHUB_TOKEN, and the data lives outside the paths listed here anyway.
on:
  push:
    branches: [main]
    paths:
      - app.js
      - src/**
      - styles.css
      - index.template.html
      - build.mjs
      - package.json
      - package-lock.json
      - scorer-data.json
      - test/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
