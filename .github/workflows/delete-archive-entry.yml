name: Delete Archive Entry

on:
  repository_dispatch:
    types: [delete-archive-entry]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Delete archive entry
        env:
          ARCHIVE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node .github/scripts/delete-archive-entry.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ leaguesim-data.json
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "archive: deleted entry" && git push)
