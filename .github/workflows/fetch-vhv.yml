name: Fetch VHV Data

on:
  # GitHub cron runs in UTC only, and Belgium switches between UTC+1 and UTC+2.
  # So every wanted local time is scheduled at BOTH possible UTC hours and the
  # "gate" job below keeps only the runs that land on the intended Brussels
  # time. Minutes are off the :00/:30 marks on purpose: GitHub documents that
  # the scheduler is busiest there and runs get delayed or dropped.
  #
  # Wanted (Brussels time):
  #   Mon-Fri  once at night (03:17 / 04:17), and once in the evening (~22:35)
  #   Sat-Sun  hourly from 14:05 to 23:05
  schedule:
    - cron: "17 2 * * 1-5"          # 03:17 (winter) / 04:17 (summer) - any hour 01-06 is fine
    - cron: "35 20,21 * * 1-5"      # evening: gate keeps the one that is 22:35 local
    - cron: "5 12-22 * * 6,0"       # weekend: gate keeps 14:05-23:05 local
  workflow_dispatch:
    inputs:
      force_full:
        description: "Re-fetch every league, ignoring the skip rules"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decides whether a scheduled run falls on a wanted Brussels time. Manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          dow=$(TZ=Europe/Brussels date +%u); hour=$(TZ=Europe/Brussels date +%-H)
          echo "Brussels time now: $(TZ=Europe/Brussels date '+%a %H:%M')"
          ok=false
          if [ "$dow" -ge 6 ] && [ "$hour" -ge 14 ] && [ "$hour" -le 23 ]; then ok=true; fi
          if [ "$dow" -le 5 ] && [ "$hour" -ge 1 ] && [ "$hour" -le 6 ]; then ok=true; fi
          if [ "$dow" -le 5 ] && [ "$hour" -eq 22 ]; then ok=true; fi
          echo "run=$ok" >> "$GITHUB_OUTPUT"

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # If a run is still going when the next trigger fires, cancel the stale one
    # instead of letting two runs fight over the same git push. (Per job, so the
    # skipped off-hour triggers never cancel a real run.)
    concurrency:
      group: fetch-vhv
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so the cached Chromium always matches the
          # playwright-core version we actually run. (The old key was a fixed
          # string, so a cache written by a mismatched install kept being
          # restored and the browser was "missing".)
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Installs exactly the versions in package-lock.json (production deps
      # only: playwright-core).
      - name: Install dependencies
        run: npm ci --omit=dev

      # IMPORTANT: use the playwright-core CLI that was just installed. The old
      # `npx playwright install` ran with only playwright-core present, so npx
      # downloaded the latest *playwright* package, whose Chromium revision
      # differs from the one playwright-core expects: "Executable doesn't exist".
      - name: Install Chromium (cached) or Chromium + OS deps (cold)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            node node_modules/playwright-core/cli.js install chromium
          else
            node node_modules/playwright-core/cli.js install chromium --with-deps
          fi

      # Quiet leagues (no game today/yesterday, nothing pending) are skipped and
      # their previous data reused; see refreshReason() in fetch-vhv.js.
      - name: Fetch VHV data
        env:
          FORCE_FULL: ${{ inputs.force_full && '1' || '' }}
        run: node .github/scripts/fetch-vhv.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ boxscore-cache.json venue-cache.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update VHV data [$(date -u '+%Y-%m-%d %H:%M UTC')]" && git push)
