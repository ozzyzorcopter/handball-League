name: Fetch VHV Data

on:
  schedule:
    - cron: "0,30 12-23 * * 6,0"   # half-hourly Sat+Sun 12:00-23:30 UTC
    - cron: "0 7 * * 1-5"           # once daily weekdays 07:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# If a run is still going when the next half-hourly trigger fires (the
# venue/boxscore work can make a run take a while), cancel the stale one
# instead of letting two runs overlap and fight over the same git push.
concurrency:
  group: fetch-vhv
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # Pinned playwright-core version keeps this key (and therefore the
          # cached Chromium download) stable across runs — letting npm grab
          # whatever is "latest" would silently bust the cache on every
          # version bump upstream. Bump the version here too when you
          # deliberately want to pick up a newer Chromium build.
          key: playwright-chromium-1.63.0-${{ runner.os }}

      - name: Install playwright-core
        run: npm install playwright-core@1.63.0

      # On a cache hit the browser binary is already on disk, so this just
      # verifies/links it (fast, no download). On a cache miss it does the
      # full download + OS-dependency install (slow, but only happens once
      # until the pinned version above changes).
      - name: Install Chromium (cached) or Chromium + OS deps (cold)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Fetch VHV data
        run: node .github/scripts/fetch-vhv.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vhv-data.json boxscore-cache.json venue-cache.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update VHV data [$(date -u '+%Y-%m-%d %H:%M UTC')]" && git push)
