name: Fetch VHV Data

on:
  schedule:
    - cron: "0,30 12-23 * * 6,0"   # half-hourly Sat+Sun 12:00-23:30 UTC
    - cron: "0 7 * * 1-5"           # once daily weekdays 07:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Playwright + Chromium
        run: |
          npm install playwright-core
          npx playwright install chromium --with-deps

      - name: Fetch VHV data
        run: node .github/scripts/fetch-vhv.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vhv-data.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update VHV data [$(date -u '+%Y-%m-%d %H:%M UTC')]" && git push)
