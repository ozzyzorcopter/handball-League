name: Fetch VHV Data

on:
  # Started by an external timer (cron-job.org, time zone Europe/Brussels) that calls the
  # workflow_dispatch API, because GitHub's own cron starts late and drops runs.
  # Wanted (Brussels time): Mon-Fri once at night (01-06) and once at 22:30;
  # Sat-Sun hourly from 14:00 to 23:00. Manual runs work the same way.
  workflow_dispatch:
    inputs:
      force_full:
        description: "Re-fetch every league, ignoring the skip rules"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    # If a run is still going when the next trigger fires, cancel the stale one
    # instead of letting two runs fight over the same git push.
    concurrency:
      group: fetch-vhv
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Quiet leagues (no game today/yesterday, nothing pending) are skipped and
      # their previous data reused; see refreshReason() in fetch-vhv.js.
      - name: Fetch VHV data
        env:
          FORCE_FULL: ${{ inputs.force_full && '1' || '' }}
        run: node .github/scripts/fetch-vhv.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ boxscore-cache.json venue-cache.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update VHV data [$(date -u '+%Y-%m-%d %H:%M UTC')]" && git push)
