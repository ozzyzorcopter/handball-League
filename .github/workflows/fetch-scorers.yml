name: Fetch Scorer Data

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:        # also allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch scorer data
        run: node .github/scripts/fetch-scorers.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scorer-data.json
          git diff --cached --quiet || git commit -m "chore: update scorer data"
          git push
