name: Fetch Scorer Data

on:
  workflow_dispatch:  # Manual only — scorer data now comes from fetch-vhv.js via Clubee stats

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch scorer data
        run: node .github/scripts/fetch-scorers.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scorer-data.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update scorer data" && git push)
